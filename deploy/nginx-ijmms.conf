# /etc/nginx/sites-available/ijmms  (replace the domain; repeat as 'ijmls' with port 3002)
server {
    listen 80;
    server_name www.your-ijmms-domain.org your-ijmms-domain.org;
    client_max_body_size 40m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
# After this works on http, run:  sudo certbot --nginx -d www.your-ijmms-domain.org -d your-ijmms-domain.org
