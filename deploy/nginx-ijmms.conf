# /etc/nginx/sites-available/ijmms or ijmls  (HTTP stage, written by install.sh / add-journal.sh; __DOMAIN__ and __PORT__ are replaced)
# enable-https.sh replaces this with nginx-ijmms-https.conf once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    client_max_body_size 40m;

    # PRE-LAUNCH: keep search engines out. At launch delete these two lines, then: nginx -t && systemctl reload nginx
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
